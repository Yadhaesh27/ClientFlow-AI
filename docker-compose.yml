version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clientflow-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./clientflow.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80,http://localhost
      - JWT_SECRET=clientflow_production_super_secret_key_2026
    volumes:
      - ./backend/data:/app/data
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clientflow-frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    restart: always
